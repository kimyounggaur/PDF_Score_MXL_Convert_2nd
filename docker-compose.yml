services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app
      - worker_internal

  worker:
    build:
      context: ./worker
      target: worker
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      AUDIVERIS_BIN: /opt/audiveris/bin/Audiveris
      CONVERSION_TIMEOUT_MS: "1200000"
      JAVA_OPTS: "-Xmx4g -Djava.awt.headless=true"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 5g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    networks:
      - worker_internal
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ./web
      target: dev
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redisdata:

networks:
  app:
  worker_internal:
    internal: true
