services:
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app
      - worker_internal

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: worker
      args:
        AUDIVERIS_VERSION: "${AUDIVERIS_VERSION:-5.10.2}"
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      AUDIVERIS_BIN: /opt/audiveris/bin/Audiveris
      AUDIVERIS_VERSION: "${AUDIVERIS_VERSION:-5.10.2}"
      CONVERSION_TIMEOUT_MS: "1200000"
      JAVA_TOOL_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 5g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    networks:
      - worker_internal
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{process.exit(Date.now()-fs.statSync('/tmp/worker-heartbeat').mtimeMs<=90000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      AUDIVERIS_VERSION: "${AUDIVERIS_VERSION:-5.10.2}"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redisdata:

networks:
  app:
  worker_internal:
    internal: true
